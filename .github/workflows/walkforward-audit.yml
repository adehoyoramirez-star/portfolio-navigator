name: walkforward-audit

on:
  pull_request:
    branches: [main]
    paths:
      - "src/core/backtest/**"
      - "src/lib/assetRegistry.ts"
      - "src/lib/constants.ts"
      - "public/historical_data_daily_augmented.csv"
      - "scripts/audit/audit-historical-data.ts"
      - "scripts/download_data.py"
      - "scripts/rebuild_history.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/walkforward-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  walkforward:
    name: Run reproducible walk-forward diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout audited branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit historical CSV temporal integrity
        run: npm run audit:historical-data

      - name: Run walk-forward and capture full report
        shell: bash
        run: |
          set -o pipefail
          npx tsx src/core/backtest/run-walkforward.ts 2>&1 | tee walkforward-report.txt

      - name: Upload report even if the run fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: olympus-walkforward-report
          path: walkforward-report.txt
          if-no-files-found: warn
          retention-days: 30
